name: Lint API

on:
  push:
    paths:
      - 'apps/api/**'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'package-lock.json'

jobs:
  lint-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:api
      - run: npm run typecheck -w @jwellers/api
