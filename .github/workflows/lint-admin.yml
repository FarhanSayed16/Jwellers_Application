name: Lint Admin

on:
  push:
    paths:
      - 'apps/admin/**'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'package-lock.json'

jobs:
  lint-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:admin
